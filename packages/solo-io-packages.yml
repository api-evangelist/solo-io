note: >-
  Solo.io ships self-hosted Kubernetes software rather than a hosted SaaS API, so its
  distribution surface is Go modules, Helm charts, CLI binaries and a small set of
  npm/PyPI libraries — not a per-language REST client SDK family. Packages published
  by projects Solo.io created and donated to the CNCF (kgateway, kagent) are marked
  with an `origin` note rather than being claimed as solo-io org packages.
