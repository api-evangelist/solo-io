aid: solo-io
name: Solo.io
description: 'Solo.io is a cloud-native application-networking company founded in 2017
  that builds enterprise and open-source API gateways, service mesh, and agentic-AI
  infrastructure. Its products include Kgateway Enterprise (formerly Gloo Gateway),
  an Envoy-powered Kubernetes Gateway API ingress and API gateway; Solo Enterprise
  for Istio (formerly Gloo Mesh), a hardened Istio service mesh with ambient mode;
  Agentgateway Enterprise, a Rust-based AI-native gateway for LLM, MCP, and A2A traffic;
  Kagent Enterprise, a Kubernetes-native agent runtime; and Agentregistry Enterprise,
  a registry for agents, MCP servers, and AI tools. Solo.io also ships Gloo Portal,
  a developer portal whose Portal Server REST API manages API products, teams, apps,
  subscriptions, API keys, and OAuth credentials, and contributes the kgateway, agentgateway,
  kagent, and Istio ambient-mesh open-source projects.'
url: https://raw.githubusercontent.com/api-evangelist/solo-io/refs/heads/main/apis.yml
