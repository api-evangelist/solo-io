apis:
- aid: solo-io:portal-server
  name: Gloo Portal Server API
  description: 'The Gloo Portal Server REST API backs the Solo.io developer portal
    for Kgateway Enterprise / Gloo Gateway. It lets portal users look up their session
    user, browse API products and product versions, create and manage teams and team
    applications, subscribe applications to API products, and self-provision credentials
    (API keys and OAuth client credentials) for the APIs exposed through the portal.'
  humanURL: https://docs.solo.io/gateway/latest/portal/openapi/
  baseURL: https://portal.example.com/v1
  x-baseurl-note: Solo.io publishes the portal server as self-hosted software; its
    own OpenAPI declares the example host http://portal.example.com/v1. The production
    host is deployment-specific.
  tags:
  - Developer Portal
  - API Management
  - API Keys
  - OAuth
  properties:
  - type: OpenAPI
    url: openapi/solo-io-portal-server-openapi.yml
  - type: Overlay
    url: overlays/solo-io-portal-server-overlay.yaml
  - type: Documentation
    url: https://docs.solo.io/gateway/latest/portal/
  - type: APIReference
    url: https://docs.solo.io/gateway/latest/portal/openapi/
- aid: solo-io:portal-backend
  name: Gloo Portal Backend API
  description: 'The portal backend server API for the kgateway 2.x generation of Gloo
    Portal. It exposes health and readiness probes, the API product catalog and product
    versions, user and team management, team applications, application subscriptions,
    API keys, OAuth credentials, application metadata, and the OIDC login/logout redirect
    endpoints used by the frontend portal.'
  humanURL: https://docs.solo.io/kgateway/latest/portal/
  baseURL: https://portal.example.com/v1
  x-baseurl-note: The OpenAPI declares the relative base path /v1; the portal backend
    is self-hosted, so the host is deployment-specific.
  tags:
  - Developer Portal
  - API Management
  - Teams
  - Subscriptions
  properties:
  - type: OpenAPI
    url: openapi/solo-io-portal-backend-openapi.yml
  - type: Overlay
    url: overlays/solo-io-portal-backend-overlay.yaml
  - type: Documentation
    url: https://docs.solo.io/kgateway/latest/portal/
- aid: solo-io:gloo-platform-portal
  name: Gloo Platform Portal API
  description: 'The Gloo Platform portal API covers the endpoint specifications for
    managing user access to the developer portal and to the resources the portal exposes
    — the current user session, the list of APIs and their schemas, usage plans, and
    the API key lifecycle.'
  humanURL: https://docs.solo.io/gloo-mesh-gateway/latest/portal/
  baseURL: https://api.gloo-platform-portal.com/v1
  tags:
  - Developer Portal
  - Usage Plans
  - API Keys
  properties:
  - type: OpenAPI
    url: openapi/solo-io-gloo-platform-portal-openapi.yml
  - type: Overlay
    url: overlays/solo-io-gloo-platform-portal-overlay.yaml
- aid: solo-io:portal-idp-connect
  name: Gloo Portal IdP Connect API
  description: 'The IdP Connect SPI that Gloo Portal calls to create and delete OAuth2
    clients in the OpenID Connect identity provider protecting Portal APIs, so portal
    users can provision their own OAuth credentials for the API products they subscribe
    to.'
  humanURL: https://docs.solo.io/gateway/latest/portal/guides/frontend-portal/credential-management/oauth/
  baseURL: https://api.gloo-platform-portal.com/v1
  tags:
  - OAuth
  - Identity Provider
  - Credential Management
  properties:
  - type: OpenAPI
    url: openapi/solo-io-portal-idp-connect-openapi.yml
  - type: Overlay
    url: overlays/solo-io-portal-idp-connect-overlay.yaml
  - type: SourceCode
    url: https://github.com/solo-io/gloo-portal-idp-connect
- aid: solo-io:ai-guardrail-webhook
  name: AI Gateway Guardrail Webhook API
  description: 'The webhook contract for the Guardrail feature in kgateway, Agentgateway
    Enterprise, and Gloo Gateway. Two endpoints — /request and /response — intercept
    prompts on the way to a large language model and responses on the way back, and
    return a Pass, Mask, or Reject action so operators can implement their own content
    filtering and guardrails across LLM providers.'
  humanURL: https://docs.solo.io/agentgateway/latest/llm/guardrails/
  baseURL: https://guardrail-webhook.example.com
  x-baseurl-note: This is a webhook contract the operator implements and the gateway
    calls; the host is deployment-specific.
  tags:
  - AI Gateway
  - Guardrails
  - LLM
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/solo-io-ai-gateway-guardrail-webhook-openapi.yml
  - type: Overlay
    url: overlays/solo-io-ai-gateway-guardrail-webhook-overlay.yaml
  - type: Documentation
    url: https://docs.solo.io/agentgateway/2.3.x/llm/guardrails/webhook/
